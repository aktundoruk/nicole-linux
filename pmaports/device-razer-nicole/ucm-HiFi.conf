# Use case configuration for the Razer Edge Wi-Fi (nicole, SM8350).
# Speakers: 2x AW88261 on PRI MI2S (MultiMedia1, hw:0,0).
# Internal mic: DMIC0/1 (LPASS VA macro, powered from WCD938x MIC BIAS1/3)
# on VA_CODEC_DMA_TX_0 (MultiMedia2, hw:0,1). Both channels currently carry
# DEC0 (DMIC0), see lab log 2026-10-28.
# USB-C monitor (DP alt mode): AFE DISPLAY_PORT_RX (MultiMedia3, hw:0,2).
# USB-C analog headset: Headphones / Headset below (untested).

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		# +20 dB (84 = 0 dB): speech at arm's length lands near -34 dBFS
		cset "name='VA_DEC0 Volume' 104"
		cset "name='VA_DEC1 Volume' 104"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."HDMI1" {
	Comment "USB-C monitor (DisplayPort)"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia3' 0"
	]

	Value {
		# below the speakers: plugging a monitor must not move speech output
		# to a monitor jack that may have nothing in it
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},2"
		JackControl "DP0 Jack"
	}
}

# USB-C analog headset (7 Nov 2026, NOT YET TRIED with an adapter): UCSI audio
# accessory -> FSA4480 -> WCD938x HPH L/R, jack from WCD938x MBHC. Shares MultiMedia1
# with the speakers: the route moves from PRI_MI2S_RX to RX_CODEC_DMA_RX_0 while the
# headphones are in use and back on unplug, so plain ALSA users of hw:0,0 keep the
# speakers. Digital gain starts at -20 dB (84 = 0 dB): headphone level is kept low on
# purpose until it is measured with real headphones.
# No JackControl and a priority below the speakers: on r27 the WCD938x MBHC reports
# "Headphone Jack" and "Mic Jack" plugged with nothing attached (only the Mac's USB
# cable; L_DET has no 3.5 mm jack behind it, and mainline wcd938x does not gate MBHC on
# the USB-C audio accessory mode like wcd939x does). With the jack wired in, PipeWire
# would move sound to the headphones. Until MBHC is gated, headphones are chosen by hand.
SectionDevice."Headphones" {
	Comment "USB-C headphones"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_RX0 Digital Volume' 64"
		cset "name='RX_RX1 Digital Volume' 64"
	]

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 90
		PlaybackPCM "hw:${CardId},0"
	}
}

# Headset microphone (AMIC2 on WCD938x, MIC BIAS2): MultiMedia2 takes the WCD TX path
# instead of the VA DMICs while a headset is plugged in.
SectionDevice."Headset" {
	Comment "USB-C headset microphone"

	EnableSequence [
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		CapturePriority 90
		CapturePCM "hw:${CardId},1"
	}
}
