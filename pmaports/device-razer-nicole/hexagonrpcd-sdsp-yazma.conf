# Razer Edge sensors: the SLPI writes its registry at first start, which the distro's
# hexagonrpcd cannot do. Use the write-capable build (hexagonrpcd-yazma) and the
# device directory explicitly (its guess from the DT model would be "Qualcomm").
[Service]
ExecStart=
ExecStart=/usr/lib/hexagonrpcd-yazma/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8350/razer/nicole
Environment=LD_LIBRARY_PATH=/usr/lib/hexagonrpcd-yazma
