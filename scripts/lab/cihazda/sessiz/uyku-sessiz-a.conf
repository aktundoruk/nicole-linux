# Ayırma deneyi A (1 Kasım 2026): SoundWire + WCD938x (and the card, which can't bind
# without them) stay out; LPASS macros, LPI pinctrl and lpassaudiocc load as usual.
# ADSP sleeps -> the vote comes from SoundWire/WCD938x; stays awake -> macros or LPI pinctrl.
install snd_soc_sm8250 /bin/false
install snd_soc_wcd938x /bin/false
install snd_soc_wcd938x_sdw /bin/false
install soundwire_qcom /bin/false
