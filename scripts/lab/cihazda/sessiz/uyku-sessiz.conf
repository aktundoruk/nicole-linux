# One boot without the LPASS audio stack (sessiz açılış deneyi, 1 Kasım 2026). Copied to
# /run/modprobe.d/ by sessiz-erken.service only when /var/lib/uyku-test/sessiz-bir-kez
# exists; /run is tmpfs, so the next boot is normal again by itself.
# Not unloading on purpose: snd_soc_wcd938x never removes its irq domain, and a later PCI
# rescan crashed on it (lab log 1 Kasım).
install snd_soc_sm8250 /bin/false
install snd_soc_wcd938x /bin/false
install snd_soc_wcd938x_sdw /bin/false
install soundwire_qcom /bin/false
install snd_soc_lpass_rx_macro /bin/false
install snd_soc_lpass_tx_macro /bin/false
install snd_soc_lpass_va_macro /bin/false
install snd_soc_lpass_wsa_macro /bin/false
install pinctrl_sc7280_lpass_lpi /bin/false
install lpassaudiocc_sc7280 /bin/false
