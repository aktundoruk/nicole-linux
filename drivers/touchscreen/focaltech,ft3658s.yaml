%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft3658s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT3658S SPI touchscreen controller

maintainers:
  - Doruk Aktun <info@dorukaktun.com>

description:
  The FocalTech FT3658S is a capacitive touchscreen controller with an
  internal flash for its firmware, connected over SPI. It reports up to
  10 contacts.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: focaltech,ft3658s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Analog power supply (3.0V)

  iovdd-supply:
    description: I/O power supply (1.8V)

  spi-max-frequency:
    maximum: 6000000

  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-swapped-x-y: true

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - iovdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "focaltech,ft3658s";
            reg = <0>;
            spi-max-frequency = <6000000>;

            interrupt-parent = <&tlmm>;
            interrupts = <23 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 22 GPIO_ACTIVE_LOW>;

            vdd-supply = <&vreg_l3c_3p0>;
            iovdd-supply = <&vreg_l8c_1p8>;

            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2400>;
            touchscreen-inverted-x;
            touchscreen-inverted-y;
        };
    };
...
